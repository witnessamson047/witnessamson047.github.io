<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Background -->
  <rect width="800" height="450" fill="#f4ecdd"/>
  <ellipse cx="650" cy="80" rx="260" ry="120" fill="#c9a227" opacity="0.08"/>

  <!-- Browser window -->
  <rect x="55" y="45" width="690" height="360" rx="14" fill="#fdfaf2" stroke="#dcc79d" stroke-width="2"/>
  <rect x="55" y="45" width="690" height="34" rx="14" fill="#efe3cf"/>
  <rect x="55" y="70" width="690" height="9" fill="#efe3cf"/>
  <circle cx="78" cy="62" r="5" fill="#ef4444"/>
  <circle cx="96" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="114" cy="62" r="5" fill="#22c55e"/>
  <rect x="140" y="54" width="300" height="16" rx="8" fill="#dcc79d"/>
  <text x="152" y="66" fill="#7d6a52" font-family="monospace" font-size="10">scan.oweru.co.tz / report</text>

  <!-- Score ring -->
  <circle cx="185" cy="185" r="55" fill="none" stroke="#dcc79d" stroke-width="11"/>
  <circle cx="185" cy="185" r="55" fill="none" stroke="#c9a227" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="297 345" transform="rotate(-90 185 185)"/>
  <text x="185" y="188" text-anchor="middle" fill="#3a2214" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="bold">86</text>
  <text x="185" y="212" text-anchor="middle" fill="#7d6a52" font-family="Inter, sans-serif" font-size="11">/100 Strong</text>
  <text x="185" y="280" text-anchor="middle" fill="#7d6a52" font-family="Inter, sans-serif" font-size="12">Website Health Score</text>

  <!-- Area bars -->
  <g font-family="Inter, sans-serif" font-size="12" fill="#7d6a52">
    <text x="310" y="140">Security</text>
    <rect x="310" y="148" width="380" height="10" rx="5" fill="#dcc79d"/>
    <rect x="310" y="148" width="360" height="10" rx="5" fill="#c9a227"/>

    <text x="310" y="192">Mobile</text>
    <rect x="310" y="200" width="380" height="10" rx="5" fill="#dcc79d"/>
    <rect x="310" y="200" width="300" height="10" rx="5" fill="#c9a227"/>

    <text x="310" y="244">Speed</text>
    <rect x="310" y="252" width="380" height="10" rx="5" fill="#dcc79d"/>
    <rect x="310" y="252" width="250" height="10" rx="5" fill="#8a6516"/>

    <text x="310" y="296">Trust</text>
    <rect x="310" y="304" width="380" height="10" rx="5" fill="#dcc79d"/>
    <rect x="310" y="304" width="330" height="10" rx="5" fill="#c9a227"/>
  </g>

  <!-- Finding rows -->
  <g font-family="Inter, sans-serif" font-size="11">
    <rect x="90" y="315" width="540" height="60" rx="10" fill="#efe3cf" stroke="#dcc79d"/>
    <circle cx="115" cy="337" r="6" fill="#22c55e"/>
    <text x="132" y="341" fill="#3a2214">SSL certificate valid</text>
    <text x="132" y="357" fill="#7d6a52">expires in 214 days</text>
    <circle cx="345" cy="337" r="6" fill="#ef4444"/>
    <text x="362" y="341" fill="#3a2214">Mixed content found</text>
    <text x="362" y="357" fill="#7d6a52">2 insecure scripts over HTTP</text>
    <circle cx="570" cy="337" r="6" fill="#f59e0b"/>
    <text x="587" y="341" fill="#3a2214">Slow load: 4.1s</text>
    <text x="587" y="357" fill="#7d6a52">images not compressed</text>
  </g>

  <!-- PDF badge -->
  <rect x="580" y="90" width="130" height="40" rx="10" fill="#c9a227" opacity="0.15"/>
  <text x="645" y="115" text-anchor="middle" fill="#8a6516" font-family="Inter, sans-serif" font-size="13" font-weight="bold">PDF report</text>
</svg>

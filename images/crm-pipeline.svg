  <!-- Column 3 -->
  <rect x="580" y="120" width="130" height="250" rx="12" fill="#efe3cf" stroke="#dcc79d"/>
  <text x="598" y="152" fill="#7d6a52" font-family="Inter, sans-serif" font-size="13" font-weight="600">Won</text>

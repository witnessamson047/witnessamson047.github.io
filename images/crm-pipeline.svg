  <!-- Column 1 -->
  <rect x="80" y="120" width="195" height="250" rx="12" fill="#efe3cf" stroke="#dcc79d"/>
  <text x="100" y="152" fill="#7d6a52" font-family="Inter, sans-serif" font-size="13" font-weight="600">New (4)</text>
  <rect x="95" y="170" width="165" height="56" rx="9" fill="#fdfaf2" stroke="#dcc79d"/>

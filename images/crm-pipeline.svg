  <!-- Column 2 -->
  <rect x="330" y="120" width="195" height="250" rx="12" fill="#efe3cf" stroke="#dcc79d"/>
  <text x="350" y="152" fill="#7d6a52" font-family="Inter, sans-serif" font-size="13" font-weight="600">Proposal sent</text>
  <rect x="345" y="170" width="165" height="70" rx="9" fill="#fdfaf2" stroke="#c9a227"/>
  <text x="356" y="192" fill="#3a2214" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Mama Ntilie Food</text>
